# ---- 【重要】出荷時のSoftDevice(S113)の後ろにアプリを置く（Hardware.md §5-3） ----
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0x1C000
CONFIG_FLASH_LOAD_SIZE=0xC4000

# ---- USB（HIDマウス＋ログ用USBシリアルの複合デバイス） ----
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SAMPLE_USBD_MANUFACTURER="KAZUMA"
CONFIG_SAMPLE_USBD_PRODUCT="Trackball Dongle"
CONFIG_SAMPLE_USBD_PID=0x0007

# ---- 無線（ESB） ----
CONFIG_ESB=y
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_CLOCK_INIT=y

# ---- その他 ----
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
